[package]
name = "rmachine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rasm"
path = "src/bin/rasm.rs"

[[bin]]
name = "rmon"
path = "src/bin/rmon.rs"

[[bin]]
name = "rdis"
path = "src/bin/rdis.rs"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
rmachine-legacy = { path = "../rmachine-legacy" }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"
