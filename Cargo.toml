[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "rmachine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A simple 32-bit RISC CPU emulator and assembler"
repository = "https://github.com/aleury/rmachine"
homepage = "https://github.com/aleury/rmachine"
keywords = ["cpu", "emulator", "risc", "assembler", "virtual-machine"]
categories = ["emulators", "command-line-utilities"]

[[bin]]
name = "rasm"
path = "src/bin/rasm.rs"

[[bin]]
name = "rmon"
path = "src/bin/rmon.rs"

[[bin]]
name = "rdis"
path = "src/bin/rdis.rs"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
rmachine-legacy = { path = "crates/rmachine-legacy" }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"
